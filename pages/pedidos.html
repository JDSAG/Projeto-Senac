<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Seu Pedido</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 min-h-screen">
        <header class="bg-white shadow p-5 flex items-center gap-4">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                <svg  class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>

            <h1 class="text-2xl font-bold">
                Seu Pedido
            </h1>
        </header>

        <main class="max-w-3xl mx-auto p-4">
            <div id="pedido" class="space-y-4"></div>

            <div id="vazio" class="hidden text-center bg-white rounded-xl p-10">
                <p class="text-gray-500">
                    Nenhum pedido encontrado
                </p>
            </div>

            <div class="flex gap-3 mt-6">
                <button  onclick="limparPedido()" class="w-1/3 bg-red-500 text-white py-4 rounded-xl font-bold">
                    Remover Tudo
                </button>

                <button onclick="finalizarPedido()" class="flex-1 bg-black text-white py-4 rounded-xl font-bold">
                    Finalizar Pedido
                </button>
            </div>
        </main>

        <script>
            // Calcula o valor total do produto
            // pega o preço e multiplica pela quantidade
            function calcularTotal(item){
                let valor = Number(
                    item.price
                    .replace("R$","") //remove o R$
                    .replace(".","") //remove ponto de milhar
                    .replace(",",".") //troca vírgula por ponto
                );

                // multiplica preço pela quantidade
                let total = valor * item.quantity;

                // devolve o valor formatado em R$
                return "R$ " + total
                .toFixed(2)
                .replace(".",",");
            }

            // Remove um produto específico do pedido
            function removerPedido(index){
                // remove o produto pelo índice
                cart.splice(index, 1);
                // salva o carrinho atualizado
                localStorage.setItem("cart", JSON.stringify(cart));

                // atualiza a página
                location.reload();
            }

            // Remove todos os produtos do pedido
            function limparPedido(){

                // apaga o carrinho inteiro
                localStorage.removeItem("cart");
                // recarrega a página
                location.reload();
            }

            // Finaliza pedido
            function finalizarPedido(){
                // verifica se está vazio
                if(cart.length === 0){
                    alert("Seu pedido está vazio!");

                    return;
                }

                alert("Pedido enviado com sucesso!");

                // limpa os pedidos
                localStorage.removeItem("cart");
                // volta para o início
                window.location.href = "index.html";
            }

            //Área dos pedidos
            const pedidoArea = document.getElementById("pedido");
            const vazio = document.getElementById("vazio");

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            //se não tem pedido
            if(cart.length === 0){
                vazio.classList.remove("hidden");
            }else{
                //mostra cada produtos
                cart.forEach((item,index)=>{
                    pedidoArea.innerHTML += `
                        <div class="bg-white rounded-2xl shadow p-4 flex gap-4">
                            <img src="${item.image}" class="w-28 h-28 rounded-xl object-cover">
                        <div>

                            <h2 class="font-bold text-lg">
                                ${item.title}
                            </h2>

                            <p class="font-bold text-xl mt-3">
                                ${calcularTotal(item)}
                            </p>

                            <p>
                                Quantidade: ${item.quantity}
                            </p>

                            <button onclick="removerPedido(${index})" class="bg-red-500 text-white px-4 py-2 rounded-lg mt-3">
                                Remover
                            </button>
                        </div>
                    </div>`;
                });
            }
        </script>
    </body>
</html>
