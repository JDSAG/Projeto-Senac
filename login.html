<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
            <h1 class="text-3xl font-bold text-center mb-6">
                Login
            </h1>

            <form id="loginForm">
                <!-- Email -->
                <div class="mb-4">
                    <label class="block mb-2 font-medium">
                        Email
                    </label>

                    <input id="email" type="email" placeholder="Digite seu email" class="w-full border p-3 rounded-xl outline-none" required>
                </div>

                <!-- Senha -->
                <div class="mb-4">
                    <label class="block mb-2 font-medium">
                        Senha
                    </label>

                    <input id="senha" type="password" placeholder="Digite sua senha" class="w-full border p-3 rounded-xl outline-none" required>
                </div>

                <p id="erro" class="text-red-500 mb-3"></p>

                <button type="submit" class="w-full bg-black text-white py-3 rounded-xl font-semibold hover:bg-gray-800 transition duration-300">
                    Entrar
                </button>

                <div class="my-4 text-center">
                    <span class="text-gray-400">
                        ou
                    </span>
                </div>

                <button type="button" id="googleLogin" class="w-full border border-gray-300 py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-100 transition duration-300">
                    <img src="img/google_icon-icons.com_62736.png" alt="icon-google" class="w-4 h-4 object-contain">
                    Entrar com Google
                </button>
            </form>

            <p class="text-center mt-5 text-gray-500">
                Não possui conta? <a href="cadastro.html" class="text-blue-500">Cadastre-se</a>
            </p>
        </div>

        <script type="module" src="js/login.js"></script>
    </body>
</html>
